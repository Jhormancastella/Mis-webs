<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Portfolio</title>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <link id="favicon" rel="icon" type="image/png" href="img/favicon-1.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Inter"', '"Segoe UI"', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 font-sans min-h-screen transition-colors duration-300">

  <!-- ===== LOGIN SCREEN ===== -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-xl p-8 text-center">

      <div class="flex items-center justify-center gap-3 mb-2">
        <img id="titleIcon" src="img/favicon-1.png" alt="logo" class="w-9 h-9 rounded-xl shadow">
        <h1 class="text-xl font-bold text-gray-900 dark:text-white">Panel de Administración</h1>
      </div>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-7">Ingresa tus credenciales para continuar</p>

      <form id="loginForm" class="text-left space-y-4">
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="admin@example.com" autocomplete="email"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
        </div>
        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
        </div>
        <button type="submit"
          class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold text-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg mt-1">
          Iniciar Sesión
        </button>
        <p id="loginError" class="text-red-500 text-sm text-center min-h-[18px]" aria-live="polite"></p>
      </form>

      <a href="index.html" class="inline-block mt-5 text-sm text-indigo-500 hover:text-indigo-700 dark:hover:text-indigo-300 transition-colors font-medium">
        ← Volver al Portfolio
      </a>
    </div>
  </div>

  <!-- ===== ADMIN PANEL ===== -->
  <div id="adminPanel" class="hidden max-w-5xl mx-auto px-4 py-8">

    <!-- Header -->
    <header class="flex items-center justify-between mb-8 pb-6 border-b border-gray-200 dark:border-gray-700">
      <div class="flex items-center gap-3">
        <img id="titleIconHeader" src="img/favicon-1.png" alt="logo" class="w-9 h-9 rounded-xl shadow">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Panel de Administración</h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="themeToggle" type="button" title="Cambiar tema"
          class="theme-toggle w-10 h-10 flex items-center justify-center rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 hover:border-indigo-400 transition-all shadow-sm">
          <i id="themeIcon" class="bi bi-sun text-yellow-400 text-xl"></i>
        </button>
        <button id="logoutBtn" type="button"
          class="px-4 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 text-sm font-semibold transition-all border border-gray-200 dark:border-gray-700">
          Cerrar Sesión
        </button>
      </div>
    </header>

    <!-- Add / Edit Form -->
    <section class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm p-6 mb-6">
      <h2 id="formTitle" class="text-lg font-bold text-gray-900 dark:text-white mb-6">➕ Agregar Nuevo Proyecto</h2>

      <form id="projectForm" class="space-y-4">
        <input type="hidden" id="projectId">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="projectName" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Nombre del Proyecto *</label>
            <input type="text" id="projectName" required placeholder="Ej: MarcaLibros Free"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
          </div>
          <div>
            <label for="projectCategory" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Categoría *</label>
            <select id="projectCategory" required
              class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all cursor-pointer">
              <option value="">Seleccionar...</option>
              <option value="tool">🔧 Herramientas</option>
              <option value="map">🗺️ Mapas</option>
              <option value="fun">🎮 Entretenimiento</option>
            </select>
          </div>
        </div>

        <div>
          <label for="projectUrl" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">URL del Proyecto *</label>
          <input type="url" id="projectUrl" required placeholder="https://ejemplo.com"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div>
          <label for="projectIcon" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">URL del Logo/Icono *</label>
          <input type="url" id="projectIcon" required placeholder="https://ejemplo.com/logo.png"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div>
          <label for="projectGithub" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Repositorio GitHub <span class="font-normal text-gray-400">(opcional)</span></label>
          <input type="url" id="projectGithub" placeholder="https://github.com/usuario/repo"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div>
          <label for="projectDescription" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Descripción *</label>
          <textarea id="projectDescription" required rows="3" placeholder="Describe tu proyecto..."
            class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all resize-none"></textarea>
        </div>

        <div class="flex gap-3 pt-1">
          <button type="submit" id="submitBtn"
            class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-sm font-semibold transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md">
            Agregar Proyecto
          </button>
          <button type="button" id="cancelBtn"
            class="hidden px-6 py-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 text-sm font-semibold border border-gray-200 dark:border-gray-700 transition-all">
            Cancelar
          </button>
        </div>
      </form>
    </section>

    <!-- Projects list -->
    <section class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm p-6">
      <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-6">
        📋 Proyectos Existentes
        <span class="ml-2 px-2.5 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 text-sm font-semibold" id="projectsCount">0</span>
      </h2>
      <div id="projectsList" class="space-y-3"></div>
    </section>

  </div>

  <script>
    const imagenesFavicon = ['img/favicon-1.png','img/favicon-2.png','img/favicon-3.png','img/favicon-4.png','img/favicon-5.png'];
    let indiceActual = 0;
    const elementoFavicon = document.getElementById('favicon');
    const titleIcon = document.getElementById('titleIcon');
    const titleIconHeader = document.getElementById('titleIconHeader');
    function animarFavicon() {
      indiceActual = (indiceActual + 1) % imagenesFavicon.length;
      elementoFavicon.href = imagenesFavicon[indiceActual];
      if (titleIcon) titleIcon.src = imagenesFavicon[indiceActual];
      if (titleIconHeader) titleIconHeader.src = imagenesFavicon[indiceActual];
    }
    setInterval(animarFavicon, 300);
  </script>
  <script type="module" src="admin.js"></script>
</body>
</html>
