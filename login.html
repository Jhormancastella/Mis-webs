<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Panel Admin</title>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <link id="favicon" rel="icon" type="image/png" href="img/favicon-1.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Inter"', '"Segoe UI"', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 font-sans min-h-screen flex items-center justify-center px-4 transition-colors duration-300">

  <div class="w-full max-w-sm bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-xl p-8 text-center">

    <div class="flex items-center justify-center gap-3 mb-2">
      <img id="titleIcon" src="img/favicon-1.png" alt="logo" class="w-10 h-10 rounded-xl shadow">
      <h1 class="text-xl font-bold text-gray-900 dark:text-white">Acceso Admin</h1>
    </div>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-7">Inicia sesión para ir al panel de administración</p>

    <form id="loginForm" class="text-left space-y-4">
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="admin@example.com" autocomplete="email"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>
      <div>
        <label for="password" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>
      <button type="submit"
        class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold text-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg">
        Ingresar
      </button>
    </form>

    <p id="error-message" class="text-red-500 text-sm mt-3 min-h-[18px]" aria-live="polite"></p>

    <a href="index.html" class="inline-block mt-4 text-sm text-indigo-500 hover:text-indigo-700 dark:hover:text-indigo-300 transition-colors font-medium">
      ← Volver a Galería
    </a>
  </div>

  <script>
    const imagenesFavicon = ['img/favicon-1.png','img/favicon-2.png','img/favicon-3.png','img/favicon-4.png','img/favicon-5.png'];
    let indiceActual = 0;
    const elementoFavicon = document.getElementById('favicon');
    const titleIcon = document.getElementById('titleIcon');
    function animarFavicon() {
      indiceActual = (indiceActual + 1) % imagenesFavicon.length;
      elementoFavicon.href = imagenesFavicon[indiceActual];
      titleIcon.src = imagenesFavicon[indiceActual];
    }
    setInterval(animarFavicon, 300);
  </script>
  <script type="module" src="login.js"></script>
</body>
</html>
