<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Panel Admin</title>
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
    <link rel="stylesheet" href="style.css">
    <link id="favicon" rel="icon" type="image/png" href="img/favicon-1.png">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1><img id="titleIcon" src="img/favicon-1.png" alt="🔐" class="title-icon"> Acceso Admin</h1>
            <p class="auth-subtitle">Inicia sesión para ir al panel de administración</p>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="admin@example.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>

            <div id="error-message" class="error-message" aria-live="polite"></div>

            <a href="index.html" class="back-link">← Volver a Galería</a>
        </div>
    </div>

    <script>
    const imagenesFavicon = [
      'img/favicon-1.png',
      'img/favicon-2.png',
      'img/favicon-3.png',
      'img/favicon-4.png',
      'img/favicon-5.png'
    ];
    let indiceActual = 0;
    const elementoFavicon = document.getElementById('favicon');
    const titleIcon = document.getElementById('titleIcon');

    function animarFavicon() {
      indiceActual = (indiceActual + 1) % imagenesFavicon.length;
      elementoFavicon.href = imagenesFavicon[indiceActual];
      titleIcon.src = imagenesFavicon[indiceActual];
    }

    setInterval(animarFavicon, 300);
  </script>
    <script type="module" src="login.js"></script>
</body>
</html>
